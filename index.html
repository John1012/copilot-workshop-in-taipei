<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-card">
        <header class="todo-header">
          <h1>待辦清單</h1>
          <button
            id="themeToggle"
            type="button"
            class="theme-toggle"
            aria-label="切換深色模式"
            aria-pressed="false"
          >
            <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
            <span class="theme-toggle-text">深色模式</span>
          </button>
        </header>

        <form id="todoForm" class="todo-form" novalidate>
          <input
            id="todoInput"
            type="text"
            placeholder="新增待辦事項"
            aria-label="新增待辦事項"
            maxlength="120"
          />
          <button type="submit" class="add-btn">新增</button>
        </form>

        <div class="todo-filters" aria-label="待辦篩選">
          <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">
            全部
          </button>
          <button type="button" class="filter-btn" data-filter="active" aria-pressed="false">
            未完成
          </button>
          <button type="button" class="filter-btn" data-filter="completed" aria-pressed="false">
            已完成
          </button>
        </div>

        <ul id="todoList" class="todo-list" aria-live="polite"></ul>
        <p id="emptyState" class="empty-state" role="status" aria-live="polite">
          還沒有任何待辦事項,新增一個吧!
        </p>

        <footer class="todo-footer">
          <span id="remainingCount">未完成: 0 項</span>
          <button
            id="clearCompletedBtn"
            type="button"
            class="clear-completed-btn"
            aria-label="清除所有已完成待辦事項"
            hidden
          >
            清除已完成
          </button>
        </footer>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
