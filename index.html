<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="todo-card">
        <header class="todo-header">
          <h1>待辦清單</h1>
        </header>

        <form id="todoForm" class="todo-form" novalidate>
          <input
            id="todoInput"
            type="text"
            placeholder="新增待辦事項"
            aria-label="新增待辦事項"
            maxlength="120"
          />
          <button type="submit" class="add-btn">新增</button>
        </form>

        <ul id="todoList" class="todo-list" aria-live="polite"></ul>
        <p id="emptyState" class="empty-state">還沒有任何待辦事項,新增一個吧!</p>

        <footer class="todo-footer">
          <span id="remainingCount">未完成: 0 項</span>
        </footer>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
